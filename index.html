<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D SPACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 40%, #26282a 0%, #17181a 45%, #0c0d0e 85%, #0b0c0d 100%);
    color:#e6e8ea;overflow:hidden;min-height:100dvh;
    font-family:"Space Grotesk","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(130% 100% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.05;
    background-image:radial-gradient(#fff 1px, transparent 1.1px);background-size:3px 3px}
  h1{position:fixed;top:clamp(22px,5vh,48px);left:0;right:0;z-index:3;text-align:center;pointer-events:none;
    font-weight:300;font-size:clamp(20px,3.2vw,34px);letter-spacing:.5em;padding-left:.5em}
  #space{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;cursor:grab;touch-action:none}
  #space:active{cursor:grabbing}
  #status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;
    font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;color:#8b8e91}
</style>
</head>
<body>
  <h1>3D SPACE</h1>
  <canvas id="space" aria-label="Две вращающиеся 3D-модели: мужчина и женщина в экзоскелете. Перетащите, чтобы повернуть, колесо или щипок — приблизить."></canvas>
  <div id="status">LOADING</div>
<script src="assets/space.js"></script>
</body>
</html>
